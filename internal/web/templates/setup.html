{{template "head" .}}
<h2>Welcome to BugHan</h2>
<p class="muted">Create the first user and organization — this user becomes the owner.</p>
{{template "errors" .}}
<form method="post" action="/auth/setup/">
  <label>Your name <input type="text" name="name" required autofocus></label>
  <label>Email <input type="email" name="email" required></label>
  <label>Password <input type="password" name="password" minlength="8" required></label>
  <label>Organization name <input type="text" name="org" required></label>
  <button type="submit">Set up BugHan</button>
</form>
{{template "foot" .}}
